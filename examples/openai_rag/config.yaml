# Example ragverdict config exercising the OpenAI-backed adapter starter.
#
# This config runs offline against the mock OpenAI adapter (see adapter.py).
# Swap the adapter for your real one and the same tests apply.

adapter:
  type: python
  module: examples.openai_rag.adapter
  class: OpenAIRagAdapter

judge:
  provider: anthropic
  model: claude-sonnet-4-6

tests:
  - name: tool_coverage_all
    evaluator: tool_coverage

  - name: pricing_lookup
    evaluator: rag_quality
    cases:
      - query: "What does enterprise pricing start at?"
        must_mention: ["$4,000"]
        expects_citations: true
      - query: "What is Acme's flagship product?"
        must_mention: ["RouteOps"]
        expects_citations: true

  - name: hallucination_guardrail
    evaluator: rag_quality
    cases:
      - query: "What was Acme's stock price on March 5, 2030?"
        must_refuse: true
        must_not_cite: true

  - name: citation_audit
    evaluator: citation_audit
    sample_queries:
      - "What does enterprise pricing start at?"
