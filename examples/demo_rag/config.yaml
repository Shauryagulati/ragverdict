adapter:
  type: python
  module: examples.demo_rag.adapter
  class: DemoAdapter

judge:
  provider: anthropic
  model: claude-sonnet-4-6

thresholds:
  faithfulness_weak: 0.7
  relevance_weak: 0.7

tests:
  - name: tool_coverage_all
    evaluator: tool_coverage
    require_all_tools: true

  - name: direct_retrieval_basics
    evaluator: rag_quality
    cases:
      - query: "What revenue did Acme report in Q1 2025?"
        must_mention: ["$5.2M"]
        expects_citations: true
      - query: "Who is the CTO of Acme?"
        must_mention: ["Raj Patel"]
        expects_citations: true
      - query: "What is the flagship product?"
        must_mention: ["RouteOps"]
        expects_citations: true

  - name: hallucination_guardrail
    evaluator: rag_quality
    cases:
      - query: "What did Acme acquire in 2030?"
        must_refuse: true
        must_not_cite: true
      - query: "Who is the Chief Marketing Officer at Acme?"
        must_refuse: true
        must_not_cite: true

  - name: citation_audit_basics
    evaluator: citation_audit
    sample_queries:
      - "What revenue did Acme report in Q1 2025?"
      - "Who is the CTO of Acme?"
      - "What is the flagship product?"

  - name: edge_cases_battery
    evaluator: edge_cases
    cases:
      - kind: long_input
        length: 10000
      - kind: multi_turn
        turns:
          - "Who is the CEO of Acme?"
        final_query: "What was the name you just mentioned?"
        must_reference: ["Jane Smith"]
      - kind: contradiction
        query: "What was the rationale for Acme's acquisition of XYZ Corp in 2030?"
        false_premise: "Acme acquired XYZ Corp in 2030"
      - kind: empty_input
