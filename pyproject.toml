[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval"
version = "0.1.0"
description = "pytest for RAG agents — behavioral audits with PASS/FAIL/WEAK verdicts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaurya Gulati" }]
keywords = ["rag", "llm", "evaluation", "testing", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "types-PyYAML",
    "ruff>=0.5",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[project.urls]
Homepage = "https://github.com/Shauryagulati/rag-eval"
Repository = "https://github.com/Shauryagulati/rag-eval"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.hatch.build.targets.sdist]
include = ["src/rag_eval", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rag_eval"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
