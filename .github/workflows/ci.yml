name: CI

# Run on every push to main and every PR targeting main.
# `concurrency` cancels older in-flight runs for the same ref so a
# fast follow-up commit doesn't queue behind a stale job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Matrix mirrors the `requires-python = ">=3.10"` contract in
    # pyproject.toml. If we drop or add a supported version, update both.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Built-in pip cache, keyed on pyproject.toml. No external
          # action needed; saves ~30s on warm runs.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bench]"

      # Order matters: cheapest checks first so failures surface fast.
      # Ruff (~1s) → mypy (~5s) → pytest (~1s). A lint failure shouldn't
      # wait on a 30s mypy run.
      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Mypy (--strict)
        # Check against the runner's Python: third-party stubs (e.g. numpy >= 2.5 on 3.12)
        # may use syntax newer than pyproject's 3.10 default.
        run: mypy --python-version ${{ matrix.python-version }}

      - name: Pytest with coverage
        run: pytest --cov=ragverdict --cov-report=term-missing --cov-report=xml

      # Upload the XML coverage report as an artifact for inspection.
      # Skipped on non-3.12 runs to avoid duplicate artifacts.
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
